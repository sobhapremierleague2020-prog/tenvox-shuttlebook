<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rajyotsava Cup Live Score</title>
<meta name="description" content="Live scores of AURA Rajyotsava Cup 2026 badminton">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: arena scoreboard — loud, quick to read courtside, nothing decorative.
   IDEA: the umpire's chair console beside a real badminton court.
   PICTURE: a top-down court with the four players' names in their service boxes.
   COLOUR and TYPE: court green field, white lines, AURA gold for serve/winner; Barlow Condensed numerals.
   LAYOUT: score strip, court, then big +1 pads; on wide screens controls sit beside the court. */
:root{color-scheme:light dark;
--bg:light-dark(#eef2f0,#0b1512);--panel:light-dark(#ffffff,#13211c);--line:light-dark(#d5ddd9,#24352e);
--ink:light-dark(#0f1d18,#eaf3ef);--mute:light-dark(#5b6d66,#93a89f);
--court:#1d7a52;--court2:#17694a;--gold:#f2b632;--goldink:#3a2a00;--red:#e2473b;--blue:#2f6fe0}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 16px;font-weight:700;background:var(--line)}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
select{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:16px}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:0 0 6px}
header{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px);background:#0d1f19;color:#fff;flex-wrap:wrap}
header img{height:46px;border-radius:8px}
header h1{margin:0;font-size:26px;line-height:1;flex:1}
header small{display:block;font:500 13px Barlow,sans-serif;color:#a9c7bb;letter-spacing:0}
.tabs{display:flex;gap:6px}
.tabs a{color:#cfe3da;text-decoration:none;font-weight:700;padding:10px 14px;border-radius:10px;min-height:44px;display:flex;align-items:center}
.tabs a.on{background:var(--gold);color:var(--goldink)}
main{max-width:1180px;margin:0 auto;padding:16px max(3vw,12px) 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stack>*+*{margin-top:14px}
.muted{color:var(--mute);font-size:14px}
.btn-gold{background:var(--gold);color:var(--goldink)}
.btn-big{min-height:56px;font-size:20px;width:100%}
.note{padding:10px 14px;border-radius:12px;background:light-dark(#fff6dc,#2c2510);border:1px solid light-dark(#f0d48a,#5a4a1c);font-size:14px}
.err{background:light-dark(#fde8e6,#33140f);border-color:light-dark(#f1b0a8,#6b2a20)}
.teamopt{display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;background:var(--panel);border:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line);white-space:nowrap}
.pill.onair{background:var(--red);color:#fff}
.pill.gold{background:var(--gold);color:var(--goldink)}
/* live layout */
.live{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px;align-items:start}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;background:#0d1f19;color:#fff;border-radius:16px;padding:12px 14px}
.sc-team{display:flex;align-items:center;gap:10px}
.sc-team.r{flex-direction:row-reverse;text-align:right}
.sc-team img{width:44px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.sc-team b{display:block;font:700 19px/1.05 "Barlow Condensed",sans-serif}
.sc-team span{font-size:13px;color:#a9c7bb}
.sc-num{font:800 clamp(52px,12vw,76px)/1 "Barlow Condensed",sans-serif;display:flex;gap:10px;align-items:center}
.sc-num i{font-style:normal;color:#5f8274;font-size:.6em}
.srv{width:12px;height:12px;border-radius:50%;background:var(--gold);display:inline-block;box-shadow:0 0 0 4px rgba(242,182,50,.25)}
.flag{text-align:center;margin:8px 0 0;font:800 18px "Barlow Condensed",sans-serif;letter-spacing:.06em}
.flag.g{color:var(--gold)}
.court{position:relative;aspect-ratio:610/1340;width:100%;max-height:70vh;margin:12px auto 0;border-radius:10px;overflow:hidden;background:var(--court);box-shadow:inset 0 0 0 6px var(--court2)}
@supports not (aspect-ratio:1){.court{height:640px}}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.box{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;color:#fff;gap:4px}
.box .nm{font:700 clamp(17px,4.6vw,24px)/1.05 "Barlow Condensed",sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.5);overflow-wrap:anywhere}
.box .tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.35)}
.box.serving .tag{background:var(--gold);color:var(--goldink)}
.box.receiving .tag{background:#fff;color:#123}
.box.tapable{cursor:pointer}
.box.tapable:hover{background:rgba(255,255,255,.08)}
.half-tag{position:absolute;left:8px;font:700 13px Barlow;color:#fff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:8px}
.swapbtn{position:absolute;right:8px;min-height:36px;padding:0 10px;font-size:13px;background:rgba(0,0,0,.45);color:#fff}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{border-radius:16px;padding:10px;display:grid;gap:8px}
.pad .plus{min-height:96px;font:800 40px "Barlow Condensed",sans-serif;color:#fff}
.pad .minus{min-height:48px;font-size:22px}
.pad .pn{font:700 18px "Barlow Condensed",sans-serif;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 140px}
.fp-list{list-style:none;margin:0;padding:0;font-size:14px}
.fp-list li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.fp-list button{min-height:32px;padding:0 10px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--mute);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.banner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0d1f19;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:9;max-width:92vw}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:8;padding:16px}
.overlay .card{max-width:420px;width:100%}
.wcard{cursor:pointer}
.wcard:hover{border-color:var(--gold)}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.mini b{font:700 20px "Barlow Condensed",sans-serif}
.mini .num{font-size:36px;font-weight:800;text-align:right}
.enc{display:flex;justify-content:space-between;gap:8px;align-items:center}



/* ===== live view ===== */
.lv-hero{background:#0d1f19;color:#fff;border-radius:18px;padding:14px;margin:0 0 4px}
.lv-hero .muted{color:#a9c7bb}.lv-hero .pill:not(.onair){background:#24352e;color:#e9f3ee}
.lv-h{margin:0 0 10px;font-size:26px;line-height:1.05}
.lv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:14px;align-items:start}
.lv-card{background:#13211c;border:1px solid #24352e;border-radius:16px;padding:12px;display:grid;gap:8px}
.lv-card[data-watch]{cursor:pointer}.lv-card[data-watch]:hover{border-color:var(--gold)}
.lv-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:#cfe3da}
.lv-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.lv-t{display:flex;align-items:center;gap:8px}.lv-t.r{flex-direction:row-reverse;text-align:right}
.lv-t img{width:40px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.lv-t b{display:block;font:700 18px/1.05 "Barlow Condensed",sans-serif}.lv-t span{font-size:12px;color:#a9c7bb}
.lv-num{font:800 clamp(46px,11vw,84px)/1 "Barlow Condensed",sans-serif;display:flex;gap:8px;align-items:center}
.lv-card:not(.big) .lv-num{font-size:44px}
.lv-num i{font-style:normal;color:#5f8274;font-size:.55em}
.lv-num.sa span:first-child,.lv-num.sb span:last-child{color:var(--gold)}
.lv-flag{text-align:center;font:800 18px "Barlow Condensed",sans-serif;letter-spacing:.06em;color:#fff;background:#2a1414;border:1px solid #6b2a20;border-radius:10px;padding:4px}
.lv-flag.g{color:var(--goldink);background:var(--gold);border-color:var(--gold)}
.lv-srv{text-align:center;font-size:14px;color:var(--gold);font-weight:600}
.lv-enc{display:grid;gap:6px;font-size:14px;color:#dfeee7;border-top:1px solid #24352e;padding-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid #2c4a3e;color:#cfe3da;white-space:nowrap}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.lv-courtbox{background:#13211c;border:1px solid #24352e;border-radius:16px;padding:10px}
.lv-courtbox summary{cursor:pointer;font-weight:700;color:#cfe3da;min-height:32px}
.lv-courtbox .court{max-height:60vh;max-width:280px}
.lv-pl{display:none;text-align:center;font-size:13px;color:#a9c7bb}.lv-pl i{color:#6f8f82}
td.n{white-space:nowrap}
em.nf,em.ns{font-style:normal}em.ns{display:none}
@media(max-width:600px){.lv-t img,.lv-t>div>span{display:none}em.nf{display:none}em.ns{display:inline}.lv-pl{display:block}.lv-t b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lv-t>div{min-width:0;overflow:hidden}.lv-num{font-size:46px;gap:4px}.lv-main{gap:10px}.lv-flag{font-size:15px}}
@media(max-width:860px){.lv-grid{grid-template-columns:minmax(0,1fr)}.lv-courtbox .court{max-height:50vh;max-width:240px}.lv-h{font-size:22px}.lv-t img{width:32px;height:38px}.lv-t b{font-size:16px}}

/* ===== full-screen phone scoring ===== */
.ms-lock{background:#2c2510;border:1px solid #5a4a1c;border-radius:14px;padding:14px;color:#fff;font-size:15px}.ms-lock span{color:#e8d9a8;font-size:14px}.ms-lock .row button{min-height:52px;flex:1}.ms-lock #back{background:#24352e;color:#fff}

body.mscore{overflow:hidden}body.mscore header{display:none}body.mscore main{padding:0}
.ms{position:fixed;inset:0;height:100dvh;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;background:#0b1712;color:#fff;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:6;-webkit-user-select:none;user-select:none}
.ms-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-size:14px;color:#cfe3da}
.ms-top button{min-height:44px;min-width:52px;font-size:26px;line-height:1;background:#1c2c25;color:#fff;border-radius:12px;padding:0 10px}
.ms-board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:6px;padding:0 10px}
.ms-team{background:#13211c;border-radius:14px;padding:8px 10px;text-align:center;border-top:5px solid var(--c)}
.ms-team.srvside{box-shadow:inset 0 0 0 2px var(--gold)}
.ms-tn{font:700 16px/1.1 "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-pl{font-size:12px;color:#a9c7bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-sc{font:800 clamp(44px,13vw,64px)/1 "Barlow Condensed",sans-serif;margin-top:2px}
.ms-srv{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.04em}.ms-srv.off{visibility:hidden}
.ms-vs{display:flex;align-items:center;justify-content:center;font:800 14px "Barlow Condensed",sans-serif;color:#6f8f82;max-width:70px;text-align:center}
.ms-vs .g{color:var(--gold)}
.ms-iv{margin:6px 10px 0;background:#2c2510;border:1px solid #5a4a1c;border-radius:12px;padding:6px 10px;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ms-iv button{min-height:36px;padding:0 12px;background:var(--gold);color:var(--goldink)}.ms-iv #ivNo{background:#24352e;color:#fff}
.ms-line{text-align:center;font-size:13px;color:var(--gold);padding:6px 10px 0;font-weight:600}
.ms-court{min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:6px 10px}
.ms-court .court{height:100%;width:auto;max-width:100%;max-height:100%;margin:0;aspect-ratio:610/1340}
.ms-court .box .nm{font-size:clamp(14px,3.8vw,20px)}
.ms-act{padding:6px 10px 10px;display:grid;gap:10px;background:#0d1f19;border-top:1px solid #1f3129}
.ms-last{text-align:center;font-size:14px;color:#cfe3da;min-height:20px}
.ms-pads{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ms-plus{min-height:clamp(96px,16vh,140px);border-radius:18px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.ms-plus b{font:800 44px/1 "Barlow Condensed",sans-serif}.ms-plus span{font:700 14px Barlow,sans-serif;max-width:100%;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-plus:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(1.1)}
.ms-sec{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.ms-sec button,.ms-wide{min-height:52px;background:#24352e;color:#fff;border-radius:14px;font-size:16px}
.ms-sec .ms-undo{background:#3a2f12;color:#ffd77a}
.ms-confirm{min-height:110px;background:var(--gold);color:var(--goldink);border-radius:18px;font-size:22px;line-height:1.2}.ms-confirm small{font-size:15px;font-weight:600}
.ms-wide.ms-undo{background:#3a2f12;color:#ffd77a}
.ms-done{text-align:center;font:700 18px "Barlow Condensed",sans-serif;color:var(--gold);padding:8px}
.ms-ask{text-align:center;font:800 20px "Barlow Condensed",sans-serif;color:var(--gold)}
.ms-srvgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ms-srvteam{display:grid;gap:8px;border-top:4px solid var(--c);background:#13211c;border-radius:12px;padding:8px}
.ms-srvteam>span{font:700 14px Barlow,sans-serif;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-srvteam button{min-height:50px;background:var(--c);color:#fff;font-size:17px;border-radius:12px}
.ms-srvteam .ms-swapside{min-height:38px;background:#24352e;font-size:13px}
.ms-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8}
.ms-sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--panel);color:var(--ink);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto;-webkit-user-select:text;user-select:text}
.ms-item{display:block;width:100%;text-align:left;min-height:54px;margin-bottom:8px;background:var(--line);font-size:17px;border-radius:12px;padding:0 16px}
.ms-item.danger{background:#fde8e6;color:#9b1c12}
.fpbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fpbtns button{min-height:52px}
.fp-good{background:#2f9e4f;color:#fff}.fp-yellow{background:var(--gold);color:var(--goldink)}.fp-red{background:var(--red);color:#fff}
@media(max-height:700px){.ms-court{display:none}.ms{grid-template-rows:auto auto auto auto 1fr}.ms-act{align-content:end}.ms-plus{min-height:110px}.ms-line{font-size:15px;padding:10px}}
@media(max-height:560px){.ms-plus{min-height:84px}.ms-sc{font-size:40px}.ms-sec button{min-height:46px}.ms-srvteam button{min-height:42px}}

/* mobile scorer */
button{touch-action:manipulation}
.fpbox summary{cursor:pointer;list-style:none}.fpbox summary::-webkit-details-marker{display:none}
.fpbox summary h3::after{content:" ▾";font-size:.8em;color:var(--mute)}.fpbox[open] summary h3::after{content:" ▴"}
.mbar{display:none}
@media(max-width:860px){
 body.scoring main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
 body.scoring header{padding:8px 12px}body.scoring header h1{font-size:17px}body.scoring main{padding-top:8px}body.scoring main>p:first-child{font-size:13px;margin-bottom:6px!important}body.scoring header h1 small{display:none}body.scoring header img{height:34px}
 body.scoring .tabs a,body.scoring .tabs button{min-height:38px;padding:0 10px;font-size:14px}
 body.scoring .pads,body.scoring .deskctl{display:none}
 body.scoring .court{height:min(46vh,460px);width:auto;max-width:100%;max-height:none;aspect-ratio:610/1340}
 .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#0d1f19;box-shadow:0 -6px 24px rgba(0,0,0,.35);align-items:stretch}
 .mteam{flex:1;display:grid;gap:6px}
 .mplus{min-height:104px;border-radius:16px;color:#fff;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;align-items:center;padding:8px 12px;text-align:left}
 .mplus span{grid-column:1/3;font:700 15px Barlow,sans-serif;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .mplus b{font:800 46px/1 "Barlow Condensed",sans-serif}.mplus i{font:800 26px "Barlow Condensed",sans-serif;font-style:normal;justify-self:end;background:rgba(0,0,0,.22);border-radius:10px;padding:2px 10px}
 .mplus:active{transform:scale(.97);filter:brightness(1.15)}
 .mminus{min-height:40px;background:#24352e;color:#fff;font-size:22px;border-radius:12px}
 .mmid{display:grid;gap:6px;width:56px}.mundo{min-height:0;height:100%;background:#24352e;color:#fff;font-size:22px;border-radius:12px;padding:0}
 .mfinish{flex:1;min-height:72px;font-size:17px;border-radius:14px}
 .mbar .mundo#undo2{width:64px}
}
@media(max-width:860px){.live{grid-template-columns:minmax(0,1fr)}.court{max-width:440px}}
@media(max-width:600px){.sc-team img{display:none}.sc-team b{font-size:16px}.sc-team span{font-size:12px}.sc-num{font-size:46px;gap:6px}.score{padding:10px}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}header h1{font-size:22px}.tabs{width:100%}.tabs a{flex:1;justify-content:center}}
@media(prefers-reduced-motion:no-preference){.flash{animation:fl .5s}@keyframes fl{from{background:var(--gold)}}}
</style>
</head>

/* ---------- scoring rules ---------- */
function tieOf(m){return TIES.find(t=>t.n===m.tie)||TIES[0]}
function winnerOf(m){const t=m.target,a=m.sA,b=m.sB;
 if(m.rule==='deuce'){const cap=t+9;if(a>=cap||b>=cap)return a>b?'A':'B';if((a>=t||b>=t)&&Math.abs(a-b)>=2)return a>b?'A':'B';return null}

 if(m.rule==='golden'&&a===t-1&&b===t-1)return'GOLDEN POINT';
 if(m.rule==='deuce'&&a>=t-1&&b>=t-1){if(a===b)return a===t+8?'GOLDEN POINT':'DEUCE';return(a>b?'ADVANTAGE ':'ADVANTAGE ')+team(a>b?m.teamA:m.teamB).n.toUpperCase()}
 if(a===t-1&&b<t-1)return'GAME POINT · '+team(m.teamA).n.toUpperCase();
 if(b===t-1&&a<t-1)return'GAME POINT · '+team(m.teamB).n.toUpperCase();return''}
function snap(m){return{sA:m.sA,sB:m.sB,serveTeam:m.serveTeam,server:m.server,posA:{...m.posA},posB:{...m.posB}}}
function point(side){const m=cur;if(!m||m.status!=='live')return;if(!m.serveTeam){toast('Choose who serves first');return}
 if(!isMine(m)){toast('Another phone is scoring this tie. Tap Take over first.');render();return}
 if(Date.now()-lastTap<600)return;lastTap=Date.now();
 if(!m.scorer)m.scorer={dev:MYDEV,name:myName||'Scorer',at:Date.now()};
 if(winnerOf(m)){toast('Game is over — confirm the result or undo');return}
 m.hist=(m.hist||[]).concat([{...snap(m),last:side}]).slice(-300);
 const pos=side==='A'?m.posA:m.posB;
 if(side==='A')m.sA++;else m.sB++;
 if(m.serveTeam===side){const r=pos.R;pos.R=pos.L;pos.L=r}
 else{m.serveTeam=side;const sc=side==='A'?m.sA:m.sB;m.server=sc%2===0?pos.R:pos.L}
 const half=Math.ceil(m.target/2);
 if(Math.max(m.sA,m.sB)===half&&!m.intervalDone){m.intervalDone=true;showInterval=true}
 lastMsg='Point to '+team(side==='A'?m.teamA:m.teamB).n+' · '+m.sA+'–'+m.sB;save(m);render()}

 {const srv=matches.find(x=>x.id===d.id);if(srv&&lockedByOther(srv)&&!d._takeover){if(cur&&cur.id===d.id){cur=JSON.parse(JSON.stringify(srv));toast('Scoring was taken over by '+(srv.scorer.name||'another phone'));render()}continue}}

  if(e&&(e.code==='unavailable'||e.code==='deadline-exceeded')){await new Promise(r=>setTimeout(r,600+Math.random()*600));if(!pending)pending=d;continue}

function encounters(){const map={};
 for(const m of matches.filter(m=>m.status==='done'||m.status==='live')){const k=encKey(m);(map[k]=map[k]||{type:m.type,a:[m.teamA,m.teamB].sort()[0],b:[m.teamA,m.teamB].sort()[1],ties:[],t:0}).ties.push(m);map[k].t=Math.max(map[k].t,m.updatedAt||0)}

function standings(){const st={};for(const t of TEAMS)st[t.k]={P:0,W:0,L:0,TW:0,TL:0,PTS:0,R:0};

  for(const k of[e.a,e.b]){st[k].PTS+=pts[k]}

 ${focus?`<section class="lv-hero"><h2 class="lv-h">Live now${live.length>1?` · ${live.length} courts`:''}</h2>
  <div class="lv-grid"><div class="stack">${liveCard(focus,true)}${live.filter(m=>m!==focus).map(m=>liveCard(m,false)).join('')}</div>
  <details class="lv-courtbox" ${matchMedia('(min-width:861px)').matches?'open':''}><summary>Court view · ${esc(focus.court)}</summary>${courtView(focus,false)}</details></div></section>`
 :loaded?`<section class="lv-hero"><h2 class="lv-h">No tie in play right now</h2><p class="muted" style="margin:0 0 10px">Scores appear here the moment the umpire starts a match.</p>${latestCard()}</section>`:''}
  ${resultsBlock(false)}</div>`}
/* ---------- login ---------- */
function loginView(){return `<div class="card stack" style="max-width:420px;margin:24px auto">
 <h2 style="margin:0">Scorer sign in</h2><p class="muted" style="margin:0">Only tournament scorers need to sign in. Spectators can open <a href="#watch" style="color:inherit;font-weight:700">Live view</a> without an account.</p>
 <form id="loginForm" class="stack"><div><label for="em">Email</label><input id="em" type="email" autocomplete="username" required value="${esc(loginEmail)}" style="width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:16px"></div>
 <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required style="width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:16px"></div>
 ${loginErr?`<div class="note err">${esc(loginErr)}</div>`:''}
 <button class="btn-gold btn-big" type="submit" ${loginBusy?'disabled':''}>${loginBusy?'Signing in…':'Sign in'}</button>
 <button type="button" id="forgot" style="background:transparent;text-decoration:underline;font-weight:600">Forgot password?</button></form></div>`}
function srvLine(m){if(!m.serveTeam||m.status!=='live')return '';const sc=m.serveTeam==='A'?m.sA:m.sB,box=sc%2===0?'R':'L';
 const rs=m.serveTeam==='A'?'B':'A',rp=(rs==='A'?m.posA:m.posB)||{};const recv=rp[box];
 return `● ${esc(short(m.server||''))} serving${recv?' → '+esc(short(recv))+' receiving':''} · ${box==='R'?'right':'left'} court`}
/* ---------- mobile scoring mode ---------- */
const isPhone=()=>matchMedia('(max-width:860px)').matches;
function fpPanel(m){const A=team(m.teamA),B=team(m.teamB);
 return `<div class="grid2"><div><label for="fpSide">Team</label><select id="fpSide"><option value="A">${esc(A.n)}</option><option value="B">${esc(B.n)}</option></select></div>
 <div><label for="fpWho">Player</label><select id="fpWho"><option value="">Whole team</option></select></div></div>
 <div class="fpbtns">${Object.entries(FP).map(([k,v])=>`<button data-fp="${k}" class="fp-${k}">${v.t} ${v.p>0?'+':''}${v.p}</button>`).join('')}</div>
 ${m.fp.length?`<ul class="fp-list">${m.fp.slice().reverse().map(f=>`<li><span><b>${f.pts>0?'+':''}${f.pts}</b> ${esc(FP[f.kind].t)} · ${esc(team(f.side==='A'?m.teamA:m.teamB).n)}${f.who?' · '+esc(f.who):''} <span class="muted">(${f.at})</span></span><button data-fpdel="${f.id}">Remove</button></li>`).join('')}</ul>`:'<p class="muted" style="margin:0">No fair play entries for this tie yet.</p>'}`}
function mobileLiveView(){const m=cur,t=tieOf(m),A=team(m.teamA),B=team(m.teamB),w=winnerOf(m);
 const order=m.swapped?['B','A']:['A','B'];const T=s=>s==='A'?A:B,S=s=>s==='A'?m.sA:m.sB,P=s=>s==='A'?m.playersA:m.playersB;
 const f=flagOf(m);
 const scoreCol=s=>`<div class="ms-team ${m.serveTeam===s?'srvside':''}" style="--c:${T(s).c}"><div class="ms-tn">${esc(T(s).n)}</div><div class="ms-pl">${P(s).map(short).map(esc).join(' / ')||'&nbsp;'}</div><div class="ms-sc num">${S(s)}</div>${m.serveTeam===s?'<div class="ms-srv">● SERVING</div>':'<div class="ms-srv off">&nbsp;</div>'}</div>`;
 let actions='';
 if(m.status==='live'&&!isMine(m)){actions=lockBox(m,true)}
 else if(m.status!=='live'){actions=`<div class="ms-done">Result saved · ${esc(team(m.winner==='A'?m.teamA:m.teamB).n)} won ${Math.max(m.sA,m.sB)}–${Math.min(m.sA,m.sB)}</div><button class="ms-wide" id="back">← Back to tie list</button>`}
 else if(!m.serveTeam){actions=`<div class="ms-ask">Who serves first?</div><div class="ms-srvgrid">${order.map(s=>`<div class="ms-srvteam" style="--c:${T(s).c}"><span>${esc(T(s).n)}</span>${P(s).map(n=>`<button data-srv="${s}|${esc(n)}">${esc(short(n))}</button>`).join('')}<button class="ms-swapside" data-swap="${s}">⇄ Swap sides</button></div>`).join('')}</div>`}
 else if(w){actions=`<button class="ms-confirm" id="finish2">✔ Confirm result<br><small>${esc(team(w==='A'?m.teamA:m.teamB).n)} win ${Math.max(m.sA,m.sB)}–${Math.min(m.sA,m.sB)}</small></button><button class="ms-wide ms-undo" id="undo2">↶ Undo last point</button>`}
 else{actions=`<div class="ms-last">${esc(lastMsg||'Tap the team that won the rally')}</div>
  <div class="ms-pads">${order.map(s=>`<button class="ms-plus" data-pt="${s}" style="--c:${T(s).c}" aria-label="Point to ${esc(T(s).n)}"><b>+1</b><span>${esc(T(s).n)}</span></button>`).join('')}</div>
  <div class="ms-sec"><button id="undo3" class="ms-undo" ${(m.hist||[]).length?'':'disabled'}>↶ Undo last point</button><button id="swap3">⇆ Change ends</button></div>`}
 const ivl=showInterval&&m.status==='live'?`<div class="ms-iv">Interval at ${Math.ceil(m.target/2)} — change ends? <button id="ivYes">Change</button><button id="ivNo">Later</button></div>`:'';
 const sh=sheet?`<div class="ms-sheet-bg" id="msClose"></div><div class="ms-sheet">${sheet==='fp'?`<div class="enc"><h3 style="margin:0">Fair play</h3><button id="msClose2">Done</button></div><div class="stack" style="margin-top:12px">${fpPanel(m)}</div>`:
  `<h3 style="margin:0 0 10px">Tie options</h3><button class="ms-item" id="handover">🔄 Swap scorer (hand over)</button><button class="ms-item" id="msFp">🤝 Fair play / violations</button><button class="ms-item" id="swap3">⇆ Change ends</button><button class="ms-item" id="back">← Back to tie list</button><button class="ms-item danger" id="del">${confirmDel?'Tap again to delete this tie':'🗑 Delete this tie'}</button><button class="ms-item" id="msClose2">Close</button>`}</div>`:'';
 return `<div class="ms"><div class="ms-top"><span><span class="pill onair">LIVE</span> Tie ${m.tie} · ${t.c} · ${esc(m.court)} · to ${m.target}</span><button id="msMenu" aria-label="Tie options">⋯</button></div>
 <div class="ms-board">${scoreCol(order[0])}<div class="ms-vs">${f?`<span class="${f.startsWith('GOLDEN')?'g':''}">${esc(f)}</span>`:w?'<span class="g">GAME</span>':'vs'}</div>${scoreCol(order[1])}</div>
 ${m.serveTeam&&m.status==='live'?`<div class="ms-line">${srvLine(m)}</div>`:''}${ivl}<div class="ms-court">${courtView(m,false)}</div><div class="ms-act">${actions}</div>${sh}</div>`}
/* ---------- render + events ---------- */
function buzz(){try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
let wake=null;async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cur&&cur.status==='live')keepAwake(true)});
app.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('fpbox'))fpOpen=e.target.open},true);
function route(){return location.hash==='#watch'?'watch':'score'}
function render(){const r=route();$('#tScore').className=r==='score'?'on':'';$('#tWatch').className=r==='watch'?'on':'';
 const fs=$('#fpSide')?.value,fw=$('#fpWho')?.value;
 $('#signout').hidden=!authUser;document.body.classList.toggle('scoring',!!(cur&&r==='score'&&authUser));keepAwake(!!(cur&&r==='score'&&cur.status==='live'));const mob=!!(cur&&r==='score'&&authUser&&isPhone());document.body.classList.toggle('mscore',mob);
 app.innerHTML=r==='watch'?watchView():authUser===undefined?'<p class="muted">Checking sign-in…</p>':!authUser?loginView():cur?(mob?mobileLiveView():liveView()):setupView();
 if(cur&&r==='score'){const s=$('#fpSide');if(s){if(fs)s.value=fs;fillWho();if(fw)$('#fpWho').value=fw}}}
function fillWho(){const s=$('#fpSide').value,ps=s==='A'?cur.playersA:cur.playersB;$('#fpWho').innerHTML='<option value="">Whole team</option>'+ps.map(p=>`<option>${esc(p)}</option>`).join('')}
app.addEventListener('click',e=>{const b=e.target.closest('button,[data-srv],[data-watch],#msClose');if(!b)return;const d=b.dataset;
 if(d.type){setup.type=d.type;render()}else if(d.tie){setup.tie=+d.tie;setup.pa=['','',''];setup.pb=['','',''];render()}
 else if(d.target){setup.target=+d.target;render()}else if(d.rule){setup.rule=d.rule;render()}
 else if(b.id==='start')startMatch();
 else if(d.resume){cur=JSON.parse(JSON.stringify(matches.find(m=>m.id===d.resume)));confirmDel=false;lastMsg='';sheet='';if(!lockedByOther(cur)&&cur.status==='live'&&!isMine(cur)||(!cur.scorer&&cur.status==='live'))claim(cur);render()}
 else if(b.id==='takeover'){cur.scorer={dev:MYDEV,name:myName||'Scorer',at:Date.now()};cur._takeover=true;lastMsg='You are now scoring this tie';save(cur);delete cur._takeover;render()}
 else if(b.id==='handover'){cur.scorer=null;save(cur);cur=null;sheet='';lastMsg='';toast('Handed over. The new scorer taps Resume on this tie.');render()}
 else if(d.srv){const[s,n]=d.srv.split('|');setServer(s,n)}
 else if(d.swap)swapSide(d.swap);
 else if(d.pt){point(d.pt);buzz()}else if(d.minus)undo(d.minus);else if(b.id==='undo'||b.id==='undo2'||b.id==='undo3')undo();else if(b.id==='swap3'){cur.swapped=!cur.swapped;sheet='';lastMsg='Ends changed';save(cur);render()}
 else if(b.id==='swapCourt'||b.id==='ivYes'){cur.swapped=!cur.swapped;showInterval=false;save(cur);render()}
 else if(b.id==='ivNo'){showInterval=false;render()}
 else if(b.id==='finish'||b.id==='finish2'){cur.winner=winnerOf(cur);cur.status='done';save(cur);toast('Result saved');render()}
 else if(d.fp){const side=$('#fpSide').value,who=$('#fpWho').value;cur.fp=cur.fp.concat([{id:Date.now().toString(36),side,who,kind:d.fp,pts:FP[d.fp].p,at:cur.sA+'–'+cur.sB}]);save(cur);render()}
 else if(d.fpdel){cur.fp=cur.fp.filter(f=>f.id!==d.fpdel);save(cur);render()}
 else if(b.id==='msMenu'){sheet='menu';render()}else if(b.id==='msClose'||b.id==='msClose2'){sheet='';confirmDel=false;render()}else if(b.id==='msFp'){sheet='fp';render()}
 else if(b.id==='back'){cur=null;sheet='';lastMsg='';confirmDel=false;showInterval=false;render()}
 else if(b.id==='del'){if(!confirmDel){confirmDel=true;render();setTimeout(()=>{if(confirmDel){confirmDel=false;render()}},4000)}else{const id=cur.id;cur=null;confirmDel=false;db.doc('matches/'+id).delete().catch(()=>toast('Could not delete'));render()}}
 else if(d.watch){watchId=d.watch;render();scrollTo({top:0,behavior:'smooth'})}});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-srv],[data-watch]')){e.preventDefault();e.target.click()}});
app.addEventListener('change',e=>{const t=e.target;
 if(t.id==='ta'){setup.a=t.value;setup.pa=['','',''];render()}else if(t.id==='tb'){setup.b=t.value;setup.pb=['','',''];render()}
 else if(t.id==='court')setup.court=t.value;
 else if(t.id==='scName'){myName=t.value.trim();try{localStorage.setItem('rc-name',myName)}catch(e){}}
 else if(t.dataset.side){(t.dataset.side==='a'?setup.pa:setup.pb)[+t.dataset.i]=t.value;render()}
 else if(t.id==='fpSide')fillWho()});
addEventListener('hashchange',render);let rsz;addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(cur)render()},200)});
render();
/* ---------- Firebase ---------- */
app.addEventListener('submit',async e=>{if(e.target.id!=='loginForm')return;e.preventDefault();loginEmail=$('#em').value.trim();const pw=$('#pw').value;loginBusy=true;loginErr='';render();
 try{await signInWithEmailAndPassword(auth,loginEmail,pw)}catch(err){
  loginErr=({'auth/invalid-credential':'Wrong email or password.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.','auth/network-request-failed':'No internet connection.'})[err.code]||'Could not sign in ('+(err.code||'error')+').'}
 loginBusy=false;render()});
app.addEventListener('click',async e=>{if(e.target.id!=='forgot')return;const em=($('#em')||{}).value;loginEmail=em||'';if(!em){loginErr='Type your email first, then tap Forgot password.';render();return}
 try{await sendPasswordResetEmail(auth,em.trim());toast('Password reset email sent to '+em)}catch(err){loginErr='Could not send reset email ('+(err.code||'error')+').';render()}});
$('#signout').addEventListener('click',()=>{cur=null;signOut(auth)});
try{
 if(!firebaseConfig||!firebaseConfig.apiKey||String(firebaseConfig.apiKey).startsWith('PASTE'))throw new Error('config');
 const fa=initializeApp(firebaseConfig);auth=getAuth(fa);const fs=getFirestore(fa);
 db={doc:p=>({set:d=>setDoc(doc(fs,p),d),delete:()=>deleteDoc(doc(fs,p))})};
 onAuthStateChanged(auth,u=>{authUser=u||null;canWrite=u?null:false;if(!u)cur=null;render()});
 const timer=setTimeout(()=>{if(!loaded){loadNote='Live scores can\'t be reached yet — check your connection.';render()}},10000);
 onSnapshot(query(collection(fs,'matches'),orderBy('updatedAt','desc'),limit(300)),{includeMetadataChanges:false},s=>{
  matches=s.docs.map(x=>x.data()).filter(Boolean);
  if(!s.metadata.fromCache){loaded=true;clearTimeout(timer);loadNote=''}
  if(cur&&!saving&&!pending){const fresh=matches.find(m=>m.id===cur.id);if(fresh&&(fresh.updatedAt||0)>(cur.updatedAt||0))cur=JSON.parse(JSON.stringify(fresh))}
  const a=document.activeElement;if(a&&(a.tagName==='SELECT'||a.tagName==='INPUT')&&!cur)return;render()},
  e=>{clearTimeout(timer);loaded=true;loadNote='Live scores stopped updating ('+(e.code||'error')+'). Reload the page to reconnect.';render()});
}catch(e){authUser=null;loaded=true;loadNote=e.message==='config'?'Setup needed: paste your Firebase settings into config.js (see README).':'Could not start: '+e.message;render()}
}
</script>
</body>
</html>
